<div class="ui-modal-header">
  <h2 class="ui-modal-title">{{ titulo }}</h2>
  <button type="button" class="btn-close ui-modal-close" aria-label="Cerrar" (click)="cerrar()"></button>
</div>
<form [formGroup]="form" (ngSubmit)="guardar()">
  <div class="ui-modal-body">
    <p class="ui-modal-description">{{ descripcion }} <strong>{{ incidencia.codigo || "seleccionada" }}</strong>.</p>
    <div class="ui-form-grid"><div class="ui-field ui-field--full" [class.is-invalid]="observacionInvalida">
      <label class="ui-field-label required" for="observacionReapertura">{{ etiquetaObservacion }}</label>
      <textarea id="observacionReapertura" rows="5" formControlName="observacion" [placeholder]="placeholders.INGRESAR"></textarea>
      @if (observacionInvalida) { <small>La observación es obligatoria.</small> }
    </div></div>
    @if (requiereDecision) {
      <div class="ui-field ui-field--full mt-3">
        <label class="ui-field-label required">Decisión de revisión</label>
        <div class="d-flex gap-4">
          <label><input type="radio" [value]="true" formControlName="aprobada"> Aprobar cierre</label>
          <label><input type="radio" [value]="false" formControlName="aprobada"> Rechazar cierre</label>
        </div>
      </div>
    }
  </div>
  <div class="ui-modal-footer"><app-button texto="Cancelar" icon="x" color="danger" (click)="cerrar()"></app-button><app-button [texto]="textoAccion" [icon]="iconoAccion" color="primary" type="submit"></app-button></div>
</form>
