<div id="agrihusaApp" class="agrihusa">
  <div class="agrihusa-header">
    <header class="header_container-fluid">
      <div class="header_container-fluid-div">
        <div class="header-shell">
          <div class="header-container-left">
            <div class="header-navbar-button px-2">
              <button class="navbar-toggler text-white" type="button" aria-label="Abrir menú" (click)="alternarMenu()"><span class="feather icon-menu" aria-hidden="true"></span></button>
            </div>
            <div class="agrihusa-header__title"><span class="link-to-landing">WEB INTEGRADO</span></div>
            <div class="header-combo">
              <div class="header-combo-content"><span class="header-combo-label">MÓDULO ACTUAL</span><strong class="header-role-value">PANEL DE INICIO</strong></div>
            </div>
          </div>
          <div class="header-container-right">
            <div class="header-dropdown-toggle">
              <div class="profile-group text-white me-3"><div class="user-meta"><h6 class="mb-0 fw-bold header-container-right-username">{{ user.name }}</h6><p class="mb-0 header-container-right-address">{{ user.role }} <span aria-hidden="true"> | </span> CAMPUSSEGURO 360</p></div></div>
              <button class="logout-btn" type="button" (click)="salir()"><span class="feather icon-log-out" aria-hidden="true"></span><span>Salir</span></button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="agrihusaApp-content-container">
      <aside class="agrihusaApp-content_sidebar" [class.d-none]="!menuVisible">
        <section class="h-100">
          <aside class="agrihusa-sidebar" id="agrihusa-aside-menu">
            <div><div class="d-flex justify-content-between align-items-center content-header-menu"><span class="text-white mb-0">MENÚ</span><span class="menu-collapse-icon text-white" role="button" tabindex="0" (click)="alternarMenu()">‹</span></div></div>
            <div class="menu-group">
              <div class="accordion-button" role="button" tabindex="0" [attr.aria-expanded]="grupoAbierto" (click)="alternarGrupo()">
                <span>GENERAL</span>
                <svg class="accordion-chevron" [class.expanded]="grupoAbierto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </div>
              @if (grupoAbierto) {
              <div class="accordion-body">
                <ul>
                  <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><a routerLink="/inicio">Inicio</a></li>
                  <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><a routerLink="/usuarios">Usuarios</a></li>
                  <li><span>Configuración</span></li>
                  <li><span>Reportes</span></li>
                </ul>
              </div>
              }
            </div>
          </aside>
        </section>
      </aside>
      <main class="agrihusaApp-content_main"><ng-content /></main>
    </div>
  </div>
</div>
